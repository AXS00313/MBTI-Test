<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>认知功能测试</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one narrow reading column; the quiz is a single focused card, results read top-down from type to detail. */
:root {
  --bg: #eef0f6;
  --surface: #ffffff;
  --ink: #1c2133;
  --muted: #5f667c;
  --line: #dcdfea;
  --accent: #3546c4;
  --accent-soft: #e4e7fa;
  --weak: #b4495a;
  --weak-soft: #f7e6e9;
  --nt: #7b4fc9; --nf: #2f9468; --sj: #2f74c9; --sp: #d9a21b;
  --font-display: "Noto Serif SC", "Songti SC", "SimSun", serif;
  --font-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11131b; --surface: #1a1d29; --ink: #e7e9f2; --muted: #9ba1b6; --line: #2b3042;
    --accent: #8f9cff; --accent-soft: #252a48; --weak: #e48b98; --weak-soft: #3a2229;
    --nt: #a98af0; --nf: #5ac791; --sj: #6aa7f0; --sp: #f0c24f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11131b; --surface: #1a1d29; --ink: #e7e9f2; --muted: #9ba1b6; --line: #2b3042;
  --accent: #8f9cff; --accent-soft: #252a48; --weak: #e48b98; --weak-soft: #3a2229;
  --nt: #a98af0; --nf: #5ac791; --sj: #6aa7f0; --sp: #f0c24f;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.7; }
main { max-width: 780px; margin: 0 auto; padding: 40px 18px 80px; display: flex; flex-direction: column; gap: 28px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.3; }
h1 { font-size: 34px; }
h2 { font-size: 22px; }
h3 { font-size: 18px; }
p { margin: 0; }
.muted { color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 26px; display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
button { font: inherit; cursor: pointer; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 12px 18px; transition: border-color .15s, background .15s; }
button:hover { border-color: var(--accent); }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
:root[data-theme="dark"] .primary { color: #11131b; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .primary { color: #11131b; } }
.primary:hover { filter: brightness(1.08); }
.ghost { background: transparent; }

/* Home */
.intro { display: flex; flex-direction: column; gap: 14px; }
.eyebrow { font-size: 13px; letter-spacing: 3px; color: var(--accent); font-weight: 700; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.fact { border-left: 3px solid var(--accent); padding: 4px 0 4px 12px; }
.fact b { display: block; font-size: 22px; font-family: var(--font-display); font-variant-numeric: tabular-nums; }
.groups { display: flex; flex-direction: column; gap: 18px; }
.group-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
.group-head b { color: var(--g); font-size: 15px; }
.group-head span { font-size: 13px; color: var(--muted); }
.type-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.type-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 14px 6px 12px;
            border-color: color-mix(in srgb, var(--g) 35%, var(--line));
            background: color-mix(in srgb, var(--g) 7%, var(--surface)); }
.type-btn:hover { border-color: var(--g); background: color-mix(in srgb, var(--g) 14%, var(--surface)); }
.type-btn .code { font-weight: 700; letter-spacing: 1px; }
.type-btn .nick { font-size: 12px; color: var(--muted); }
/* 徽章：组颜色的圆形底 + 白色内圈 + 动物 */
.badge { --size: 56px; width: var(--size); height: var(--size); border-radius: 50%; display: flex; align-items: center; justify-content: center;
         font-size: calc(var(--size) * 0.5); line-height: 1;
         background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--g) 55%, #fff) 0%, var(--g) 70%);
         box-shadow: inset 0 0 0 3px color-mix(in srgb, #fff 55%, transparent), 0 4px 10px color-mix(in srgb, var(--g) 35%, transparent); }
.badge.big { --size: 128px; }
.badge.small { --size: 36px; }
.group-chip { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 20px;
              background: color-mix(in srgb, var(--g) 18%, var(--surface)); color: var(--g); }

/* Quiz */
.progress-text { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.track { height: 8px; background: var(--accent-soft); border-radius: 4px; overflow: hidden; }
.fill { height: 100%; background: var(--accent); width: 0; transition: width .2s; }
.question { font-size: 21px; font-family: var(--font-display); min-height: 3.4em; }
.likert { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.likert button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 4px; }
.likert .num { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.likert .lab { font-size: 12px; color: var(--muted); }
.choice { display: flex; flex-direction: column; gap: 10px; }
.choice button { text-align: left; display: flex; gap: 12px; align-items: flex-start; padding: 16px 18px; }
.choice .letter { font-weight: 700; color: var(--accent); }
.selected { border-color: var(--accent); background: var(--accent-soft); }
.hint { font-size: 13px; color: var(--muted); }

/* Results */
.hero { display: grid; grid-template-columns: auto 1fr; gap: 22px; align-items: center; }

.hero .code { font-family: var(--font-display); font-size: 40px; letter-spacing: 3px; line-height: 1.1; }
.hero .nick { font-size: 18px; color: var(--g); font-weight: 700; }
.stack { font-variant-numeric: tabular-nums; color: var(--muted); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { font-size: 13px; padding: 3px 12px; border-radius: 20px; background: var(--accent-soft); color: var(--accent); }
.chip.weak { background: var(--weak-soft); color: var(--weak); }
.bars { display: flex; flex-direction: column; gap: 10px; }
.bar-row { display: grid; grid-template-columns: 112px 1fr 40px; gap: 12px; align-items: center; }
.bar-row .name { font-size: 14px; }
.bar-row .name b { font-variant-numeric: tabular-nums; margin-right: 4px; }
.bar-bg { height: 14px; background: var(--accent-soft); border-radius: 7px; overflow: hidden; }
.bar { height: 100%; border-radius: 7px; background: color-mix(in srgb, var(--accent) 45%, var(--surface)); }
.bar.top { background: var(--accent); }
.bar.low { background: var(--weak); }
.bar-row .val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.box { border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.box.good { background: var(--accent-soft); }
.box.bad { background: var(--weak-soft); }
.box h3 { font-size: 16px; }
.box .def { font-size: 13px; color: var(--muted); }
.item b { margin-right: 6px; }
.others { display: flex; gap: 10px; flex-wrap: wrap; }
.mini { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-radius: 12px; border: 1px solid var(--line); }

.mini .pct { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }
.warn { border-left: 4px solid var(--sj); padding: 10px 14px; background: color-mix(in srgb, var(--sj) 10%, var(--surface)); border-radius: 0 10px 10px 0; font-size: 14px; }
.roles { display: flex; flex-direction: column; gap: 12px; }
.role { display: grid; grid-template-columns: 64px 1fr; gap: 14px; padding: 14px; border: 1px solid var(--line); border-radius: 12px; }
.role .slot { display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 10px; background: var(--accent-soft); color: var(--accent); }
.role.inferior .slot { background: var(--weak-soft); color: var(--weak); }
.role .slot b { font-size: 20px; }
.role .slot span { font-size: 11px; }
.role .title { font-weight: 700; }
.role .score { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 400; font-size: 14px; }
.role p { font-size: 14px; }
.legend { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; font-size: 14px; }
.legend div { padding: 8px 12px; border-radius: 10px; background: var(--bg); }
.note { font-size: 13px; color: var(--muted); text-align: center; }
.copied { font-size: 13px; color: var(--nf); align-self: center; }

@media (max-width: 560px) {
  h1 { font-size: 28px; }
  .facts { grid-template-columns: 1fr; }
  .type-grid { grid-template-columns: repeat(2, 1fr); }
  .likert { grid-template-columns: 1fr; }
  .likert button { flex-direction: row; justify-content: flex-start; gap: 12px; padding: 10px 14px; }
  .hero { grid-template-columns: 1fr; justify-items: start; }
  .two, .legend { grid-template-columns: 1fr; }
  .bar-row { grid-template-columns: 96px 1fr 34px; }
  .panel { padding: 20px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<main id="app"></main>

function gvar(t) { return `--g: var(--${group(t).toLowerCase()})`; }
function badge(t, size = "") { return `<span class="badge ${size}" style="${gvar(t)}" aria-hidden="true">${MASCOTS[t][0]}</span>`; }
function group(t) {
  if (t[1] === "N") return t[2] === "T" ? "NT" : "NF";
  return t[3] === "J" ? "SJ" : "SP";
}
function fname(f) { return `${f} ${D.info[f].name}`; }
function shuffle(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function correlation(xs, ys) {
  const n = xs.length;
  const mx = xs.reduce((s, v) => s + v, 0) / n, my = ys.reduce((s, v) => s + v, 0) / n;
  let top = 0, bx = 0, by = 0;
  for (let i = 0; i < n; i++) { top += (xs[i] - mx) * (ys[i] - my); bx += (xs[i] - mx) ** 2; by += (ys[i] - my) ** 2; }
  if (bx === 0 || by === 0) return 0;
  return top / Math.sqrt(bx * by);
}

  questions = part1.concat(part2, part3);

  idx = 0;
  renderQuestion();
}

    <p class="hint">也可以直接按键盘上的 A 或 B。</p>`;
  }

  app.innerHTML = `
    <section class="panel">
      <div class="progress-text"><span>${part}</span><span>${idx + 1} / ${total}</span></div>
      <div class="track"><div class="fill" style="width:${(idx / total) * 100}%"></div></div>
      <p class="question">${q.text}</p>
      ${options}
      <div class="row">
        <button class="ghost" id="back" ${idx === 0 ? "disabled" : ""}>← 上一题</button>
        <button class="ghost" id="quit">退出测试</button>
      </div>
    </section>`;

  app.querySelectorAll("[data-v]").forEach(b => b.onclick = () => answer(b.dataset.v));
  document.getElementById("back").onclick = () => { if (idx > 0) { idx--; renderQuestion(); } };
  document.getElementById("quit").onclick = showHome;
}

function answer(v) {
  const q = questions[idx];
  answers[idx] = q.kind === "choice" ? v : Number(v);
  idx++;
  if (idx >= questions.length) showResult();
  else renderQuestion();
}

document.addEventListener("keydown", e => {
  if (!questions.length || idx >= questions.length || !document.querySelector(".question")) return;
  const q = questions[idx];
  const k = e.key.toUpperCase();
  if (q.kind !== "choice" && ["1","2","3","4","5"].includes(k)) answer(k);
  if (q.kind === "choice" && (k === "A" || k === "B")) answer(k);
});

// ---------------- 计分 ----------------
function computeScores() {
  const raw = {}, stress = {};
  D.functions.forEach(f => { raw[f] = 0; stress[f] = 0; });
  questions.forEach((q, i) => {
    if (q.kind === "likert") {
      const v = q.reverse ? 6 - answers[i] : answers[i];
      raw[q.func] += v;
    } else if (q.kind === "stress") {
      stress[q.func] = answers[i];      // 压力题不算进平时的分数，只作为劣势功能的线索
    } else {
      const f = answers[i] === "A" ? q.a[1] : q.b[1];
      raw[f] += 2;
    }
  });
  // 自评 6–30 分 + 二选一 0–16 分（8 道 × 2），总范围 6–46，换算成 0–100
  const absolute = {};
  D.functions.forEach(f => absolute[f] = (raw[f] - 6) / 40 * 100);
  // 显示用的相对分数：你自己最强的功能 = 100，最弱的 = 0。
  // 这样不管习惯给高分还是低分，8 个功能之间的差别都看得清楚。
  const values = Object.values(absolute);
  const lo = Math.min(...values), hi = Math.max(...values);
  const scores = {};
  D.functions.forEach(f => scores[f] = hi === lo ? 50 : Math.round((absolute[f] - lo) / (hi - lo) * 100));
  return { scores, stress };
}

const STRESS_WEIGHT = 0.05;   // 压力题线索的权重

function matchTypes(scores, stress) {
  const user = D.functions.map(f => scores[f]);
  const stressAvg = D.functions.reduce((s, f) => s + stress[f], 0) / 8;
  const result = TYPE_ORDER.map(t => {
    const stack = D.types[t];
    const template = D.functions.map(f => stack.includes(f) ? SLOT_POINTS[stack.indexOf(f)] : SHADOW_POINTS);
    // 这个类型的劣势功能，如果正好是你压力下最明显的表现，就加一点分
    const bonus = STRESS_WEIGHT * (stress[stack[3]] - stressAvg);
    return { type: t, r: Math.min(1, correlation(user, template) + bonus) };
  });
  return result.sort((a, b) => b.r - a.r);
}

// ---------------- 思考轴 ----------------
// 主导 + 辅助组成一条“思考轴”：一个感知功能（S/N）配一个判断功能（T/F），一内一外。合法的只有 8 条。
const AXES = [
  ["Ne", "Ti", "发散想法，再用内在逻辑检验"], ["Ne", "Fi", "发散可能性，再用自己的价值观筛选"],
  ["Ni", "Te", "看准方向，再用效率和结果去落实"], ["Ni", "Fe", "洞察本质，再用对人的理解去表达"],
  ["Se", "Ti", "感知眼前的情况，再快速分析原理"], ["Se", "Fi", "体验当下，再忠于自己的感受"],
  ["Si", "Te", "依靠经验，再按标准和流程执行"], ["Si", "Fe", "依靠经验，再照顾大家的需要"],
];
function axisTypes(p, j) {
  return TYPE_ORDER.filter(t => {
    const s = D.types[t];
    return (s[0] === p && s[1] === j) || (s[0] === j && s[1] === p);
  });
}
function axisBlock(t, scores) {
  const stack = D.types[t];
  const main = [stack[0], stack[1]], lower = [stack[2], stack[3]];
  let ranking = "";
  if (scores) {
    const ranked = AXES.map(([p, j, d]) => ({ p, j, d, s: Math.round((scores[p] + scores[j]) / 2) }))
      .sort((a, b) => b.s - a.s).slice(0, 3);
    ranking = `
      <p>你用得最多的 3 条轴（两个功能的平均分）：</p>
      <div class="bars">${ranked.map(a => `
        <div class="bar-row">
          <span class="name"><b>${a.p}-${a.j}</b></span>
          <div class="bar-bg"><div class="bar top" style="width:${Math.max(a.s, 2)}%"></div></div>
          <span class="val">${a.s}</span>
        </div>
        <p class="muted" style="font-size:13px;margin-top:-6px">${a.d}　·　${axisTypes(a.p, a.j).join(" / ")}</p>`).join("")}
      </div>
      <p class="muted" style="font-size:14px">类型是把 4 个功能的先后顺序都考虑进去判断的，所以有时和最强的那条轴不完全一样。</p>`;
  }
  const mainDesc = AXES.find(([p, j]) => main.includes(p) && main.includes(j))[2];
  return `
    <section class="panel">
      <h2>思考轴</h2>
      <p>主导功能和辅助功能会组成一条“思考轴”：一个负责接收信息（S/N），一个负责做判断（T/F），而且一内一外。全部只有 8 条轴，每条轴由两种类型共用，区别只在于谁是主导。</p>
      <div class="two">
        <div class="box good">
          <h3>${t} 的主轴：${main.join("-")}</h3>
          <p>${mainDesc}。同一条轴的另一种类型是 ${axisTypes(main[0], main[1]).filter(x => x !== t)[0]}，它们的主导和辅助顺序正好相反。</p>
        </div>
        <div class="box bad">
          <h3>下方的轴：${lower.join("-")}</h3>
          <p>第三和劣势功能组成的轴，是还在发展、用起来不太熟练的那一面。压力大时，这条轴的不成熟表现最容易冒出来。</p>
        </div>
      </div>
      ${ranking}
    </section>`;
}

// ---------------- 结果页 ----------------
function heroBlock(t, subtitle, percent) {
  const [emoji, nick] = MASCOTS[t];
  return `
    <section class="panel">
      <span class="eyebrow">${subtitle}</span>
      <div class="hero" style="${gvar(t)}">
        ${badge(t, "big")}
        <div>
          <span class="group-chip">${GROUPS[group(t)][0]}</span>
          <div class="code">${t}</div>
          <div class="nick">${nick}</div>
          <div class="stack">${D.types[t].join(" → ")}${percent !== undefined ? `　·　匹配度 ${percent}%` : ""}</div>
        </div>
      </div>
    </section>`;
}

function strengthsBlock(top, low, defs) {
  return `
    <div class="two">
      <div class="box good">
        <h3>惯用功能</h3>
        <p class="def">${defs ? "你最自然、最常用的思维方式。用它时不费力，甚至不会察觉自己在用，也是别人最容易看到的长处。" : ""}</p>
        ${top.map(f => `<p class="item"><b>${fname(f)}</b>${D.info[f].strong}</p>`).join("")}
      </div>
      <div class="box bad">
        <h3>盲点</h3>
        <p class="def">${defs ? "你最少用、最不熟悉的思维方式。不是“不会”，而是平时很少调动它，容易忽略这方面的信息，压力大时也容易在这里出问题。" : ""}</p>
        ${low.map(f => `<p class="item"><b>${fname(f)}</b>${D.info[f].blind}</p>`).join("")}
      </div>
    </div>`;
}

function analysisBlock(t, scores) {
  const stack = D.types[t];
  const shadow = D.functions.filter(f => !stack.includes(f));
  const roles = D.roles.map(([title, nickname, meaning], i) => {
    const f = stack[i];
    const detail = i < 3 ? `擅长：${D.info[f].strong}` : `容易出现的问题：${D.info[f].blind}`;
    const score = scores ? `<span class="score">　你的得分 ${scores[f]}</span>` : "";
    return `
      <div class="role ${i === 3 ? "inferior" : ""}">
        <div class="slot"><b>${i + 1}</b><span>${nickname}</span></div>
        <div>
          <p class="title">${title.split("·")[1].trim()}功能　${fname(f)}${score}</p>
          <p class="muted">${meaning}</p>
          <p>${detail}</p>
        </div>
      </div>`;
  }).join("");

  return `
    <section class="panel">
      <h2>什么是认知功能</h2>
      <p>认知功能是你“接收信息”和“做出判断”的方式，一共 8 个，每个都分外倾（e，朝向外部世界）和内倾（i，朝向内心世界）。</p>
      <div class="legend">
        <div><b>Se · Si</b>　看具体事实和经验</div>
        <div><b>Ne · Ni</b>　看可能性和深层含义</div>
        <div><b>Te · Ti</b>　用逻辑做判断</div>
        <div><b>Fe · Fi</b>　用情感和价值做判断</div>
      </div>
      <p>每个人其实 8 个功能都会用，但不会平均使用。每种类型有 4 个<b>主要功能</b>，排出固定的先后顺序，决定了你最自然的思考方式。</p>
    </section>
    <section class="panel">
      <h2>${t} 的 4 个主要功能</h2>
      <div class="roles">${roles}</div>
    </section>
    <section class="panel">
      <h2>另外 4 个：阴影功能</h2>
      <div class="chips">${shadow.map(f => `<span class="chip">${fname(f)}</span>`).join("")}</div>
      <p>对 ${t} 来说，这 4 个功能大多在潜意识里运作，平时很少主动用，也不容易察觉自己在用。它们往往在压力大、和人起冲突或特别累的时候冒出来，让你觉得“这不像平时的我”。阴影功能不是“不会”，只是不自然、用起来费力，也容易用得不成熟。</p>
    </section>`;
}

function showResult() {
  const { scores, stress } = computeScores();
  const stressTop = D.functions.slice().sort((a, b) => stress[b] - stress[a])[0];
  const ranked = D.functions.slice().sort((a, b) => scores[b] - scores[a]);
  const matches = matchTypes(scores, stress);
  const best = matches[0].type;
  const pct = m => Math.max(0, Math.round(m.r * 100));
  const top = ranked.slice(0, 2), low = ranked.slice(-2).reverse();

  const bars = ranked.map(f => {
    const cls = top.includes(f) ? "top" : low.includes(f) ? "low" : "";
    return `<div class="bar-row">
      <span class="name"><b>${f}</b>${D.info[f].name}</span>
      <div class="bar-bg"><div class="bar ${cls}" style="width:${Math.max(scores[f], 2)}%"></div></div>
      <span class="val">${scores[f]}</span>
    </div>`;
  }).join("");

  const judging = ["Te", "Ti", "Fe", "Fi"];
  const [f1, f2] = ranked;
  const odd = (judging.includes(f1) === judging.includes(f2)) || f1[1] === f2[1];
  const warn = odd ? `<p class="warn">你最强的两个功能是 ${f1} 和 ${f2}。按照理论，主导和辅助通常是一个判断功能（T/F）加一个感知功能（S/N），而且一内一外。可以结合下面其他接近的类型和自己的实际情况一起看。</p>` : "";

  const others = matches.slice(1, 3).map(m => `
    <button class="mini" data-type="${m.type}">${badge(m.type, "small")}
      <span><b>${m.type}</b> ${MASCOTS[m.type][1]}</span><span class="pct">${pct(m)}%</span></button>`).join("");

  const summary = `我的认知功能测试结果：最接近 ${best}（${MASCOTS[best][1]}），匹配度 ${pct(matches[0])}%。惯用功能 ${top.join("、")}，盲点 ${low.join("、")}。`;

  app.innerHTML = `
    ${heroBlock(best, "和你最接近的类型", pct(matches[0]))}
    <section class="panel">
      <h2>你的认知功能分布</h2>
      <p class="muted">分数是和你自己比较的结果：你最常用的功能是 100，最少用的是 0。</p>
      <div class="chips"><span class="chip">深色：惯用功能</span><span class="chip weak">红色：盲点</span></div>
      <div class="bars">${bars}</div>
      ${warn}
    </section>
    <section class="panel">
      <h2>惯用功能和盲点</h2>
      ${strengthsBlock(top, low, true)}
      <p class="muted" style="font-size:14px">压力题线索：你在压力下最明显的表现，最像 <b>${fname(stressTop)}</b> 作为劣势功能时的样子。用 ${fname(stressTop)} 作劣势功能的类型是 ${TYPE_ORDER.filter(x => D.types[x][3] === stressTop).join(" 和 ")}。</p>
    </section>
    <section class="panel">
      <h2>其他接近的类型</h2>
      <p class="muted">把你 8 个功能的分数和 16 种类型的标准顺序对比，越像匹配度越高。点开可以看那个类型的分析。</p>
      <div class="others">${others}</div>
    </section>
    ${axisBlock(best, scores)}
    ${analysisBlock(best, scores)}
    <div class="row">
      <button class="primary" id="again">重新测试</button>
      <button id="copy">复制结果分享给朋友</button>
      <button class="ghost" id="home">回到首页</button>
      <span class="copied" id="copied"></span>
    </div>
    <p class="note">这是自我报告问卷，结果反映的是你怎么看自己，适合用来了解自己，不是严格的心理学诊断。</p>`;

  document.getElementById("again").onclick = startTest;
  document.getElementById("home").onclick = showHome;
  document.getElementById("copy").onclick = async () => {
    const msg = document.getElementById("copied");
    try { await navigator.clipboard.writeText(summary); msg.textContent = "已复制"; }
    catch (e) { msg.textContent = summary; }
  };
  app.querySelectorAll(".mini").forEach(b => b.onclick = () => showKnownType(b.dataset.type));
  window.scrollTo(0, 0);
}

function showKnownType(t) {
  const stack = D.types[t];
  app.innerHTML = `
    ${heroBlock(t, "类型分析")}
    <section class="panel">
      <h2>惯用功能和盲点</h2>
      ${strengthsBlock(stack.slice(0, 2), [stack[3]], true)}
      <p class="muted">成长建议：有意识地练习 ${fname(stack[3])}。不用变成擅长，只要在关键时刻记得用它检查一下，就能补上 ${t} 最容易看不见的那一块。</p>
    </section>
    ${axisBlock(t)}
    ${analysisBlock(t)}
    <div class="row">
      <button class="primary" id="start">做一次完整测试</button>
      <button class="ghost" id="home">回到首页</button>
    </div>`;
  document.getElementById("start").onclick = startTest;
  document.getElementById("home").onclick = showHome;
  window.scrollTo(0, 0);
}

showHome();
</script>
</body>
</html>
